name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests and verify coverage
        run: mvn clean verify

      - name: Print JaCoCo overall coverage
        if: always()
        shell: bash
        run: |
          REPORT="target/site/jacoco/jacoco.xml"

          if [ ! -f "$REPORT" ]; then
            echo "::warning::JaCoCo XML report not found: $REPORT"
            exit 0
          fi

          python3 - "$REPORT" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()

          counter = next(
              (c for c in root.findall("counter")
               if c.get("type") == "LINE"),
              None
          )

          if counter is None:
              print("LINE coverage counter not found.")
              sys.exit(1)

          covered = int(counter.get("covered", "0"))
          missed = int(counter.get("missed", "0"))
          total = covered + missed

          if total == 0:
              print("No executable lines found in JaCoCo report.")
              sys.exit(1)

          percentage = covered * 100 / total
          print(
              f"Overall JaCoCo line coverage: {percentage:.2f}% "
              f"({covered}/{total} lines covered)"
          )
          PY
