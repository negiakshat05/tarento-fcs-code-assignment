name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests and verify coverage
        run: mvn clean verify

      - name: Print JaCoCo overall coverage
        if: always()
        shell: bash
        run: |
          REPORT="target/site/jacoco/jacoco.xml"

          if [ ! -f "$REPORT" ]; then
            echo "JaCoCo XML report not found: $REPORT"
            exit 0
          fi

          awk '
            /<counter type="LINE"/ {
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^covered="/) {
                  gsub(/covered="|"/, "", $i)
                  covered = $i
                }
                if ($i ~ /^missed="/) {
                  gsub(/missed="|"/, "", $i)
                  missed = $i
                }
              }
              total = covered + missed
              if (total > 0) {
                printf "Overall JaCoCo line coverage: %.2f%% (%d/%d lines covered)\n", covered * 100 / total, covered, total
              }
              found = 1
            }
            END {
              if (!found) print "LINE coverage counter not found in JaCoCo XML."
            }
          ' "$REPORT"